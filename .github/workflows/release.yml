name: Trusted Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ENCORE_INDEX_URL: https://raw.githubusercontent.com/encore-ecosystem/encore-index/a931b185d56bc9ae9515cfdabde721486a8c7b0c
  CORE_ARCHIVE: https://github.com/encore-ecosystem/encore-index/releases/download/packages-v0.1.4/core-0.0.0.tar.gz

jobs:
  bootstrap-ir:
    runs-on: ubuntu-latest
    env:
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reuse verified IR from the successful bootstrap job
        run: gh run download 30039870886 --repo "$GITHUB_REPOSITORY" --name trusted-bootstrap-ir --dir target
      - uses: actions/upload-artifact@v7
        with:
          name: trusted-bootstrap-ir
          path: target/*/extreme/encore.ll
          if-no-files-found: error

  build:
    needs: bootstrap-ir
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            executable: encore
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            executable: encore
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            executable: encore
          - os: macos-15
            triple: aarch64-apple-darwin
            executable: encore
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            executable: encore.exe
    runs-on: ${{ matrix.os }}
    env:
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: trusted-bootstrap-ir
          path: target
      - name: Fetch runtime sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/runtime/core target/runtime/backend target/runtime/rich
          curl --fail --location --retry 5 "$CORE_ARCHIVE" -o target/core.tar.gz
          curl --fail --location --retry 5 \
            https://github.com/encore-ecosystem/encore-index/releases/download/packages-v0.1.4/ehir_llvm_backend-0.0.0.tar.gz \
            -o target/backend.tar.gz
          curl --fail --location --retry 5 \
            https://github.com/encore-ecosystem/encore-index/releases/download/packages-v0.1.4/rich-1.0.0.tar.gz \
            -o target/rich.tar.gz
          tar -xzf target/core.tar.gz -C target/runtime/core
          tar -xzf target/backend.tar.gz -C target/runtime/backend
          tar -xzf target/rich.tar.gz -C target/runtime/rich
          echo "ENCORE_CORE_DIR=$PWD/target/runtime/core" >> "$GITHUB_ENV"
      - name: Assemble current native seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/seed
          platform_links=()
          case "${{ matrix.triple }}" in
            *-linux-*) platform_links=(-lssl -lcrypto) ;;
            *-apple-*) platform_links=(-framework Security -framework CoreFoundation) ;;
          esac
          clang -O0 -w \
            "target/${{ matrix.triple }}/extreme/encore.ll" \
            runtime.c \
            target/runtime/core/runtime.c \
            target/runtime/backend/runtime.c \
            target/runtime/rich/runtime.c \
            "${platform_links[@]}" \
            -o "target/seed/${{ matrix.executable }}"
          "target/seed/${{ matrix.executable }}" --version
      - name: Verify byte-identical self-host
        shell: bash
        run: |
          set -euo pipefail
          "target/seed/${{ matrix.executable }}" sync
          "target/seed/${{ matrix.executable }}" build --profile extreme --target "${{ matrix.triple }}"
          mkdir -p target/stage1
          cp "target/${{ matrix.triple }}/extreme/${{ matrix.executable }}" "target/stage1/${{ matrix.executable }}"
          "target/stage1/${{ matrix.executable }}" build --profile extreme --target "${{ matrix.triple }}"
          mkdir -p target/stage2
          cp "target/${{ matrix.triple }}/extreme/${{ matrix.executable }}" "target/stage2/${{ matrix.executable }}"
          cmp "target/stage1/${{ matrix.executable }}" "target/stage2/${{ matrix.executable }}"
          "target/stage2/${{ matrix.executable }}" test --filter target_
      - name: Package self-contained trusted toolchain
        shell: bash
        run: |
          set -euo pipefail
          package="encore-0.1.4-${{ matrix.triple }}"
          root="$PWD/target/package/$package"
          mkdir -p "$root/bin" "$root/lib/encore/index" "$root/share/doc/encore" dist
          cp "target/stage2/${{ matrix.executable }}" "$root/bin/${{ matrix.executable }}"
          chmod +x "$root/bin/${{ matrix.executable }}" 2>/dev/null || true
          for name in core std rich json ehirlib ehir_llvm_backend toml colorterm log llvm; do
            if test "$name" = core; then
              source="$ENCORE_CORE_DIR"
              destination=core
            else
              source=$(find "$PWD/target/registry/packages/$name" -mindepth 1 -maxdepth 1 -type d | head -n 1)
              destination=$name
              case "$name" in ehirlib) destination=ehir ;; ehir_llvm_backend) destination=ehir-llvm-backend ;; esac
            fi
            test -f "$source/encore.toml"
            cp -R "$source" "$root/lib/encore/index/$destination"
          done
          cp LICENSE README.md "$root/share/doc/encore/"
          printf '0.1.4\n' > "$root/VERSION"
          find "$root" -exec touch -t 200001010000.00 {} +
          case "${{ matrix.triple }}" in
            *-windows-*)
              archive="$PWD/dist/encore-${{ matrix.triple }}.zip"
              (cd target/package && COPYFILE_DISABLE=1 tar -a -cf "$archive" "$package")
              ;;
            *)
              archive="$PWD/dist/encore-${{ matrix.triple }}.tar.gz"
              if tar --version 2>/dev/null | grep -q GNU; then
                tar -C target/package --sort=name --owner=0 --group=0 --numeric-owner -czf "$archive" "$package"
              else
                (cd target/package && find "$package" -print | LC_ALL=C sort |
                  COPYFILE_DISABLE=1 tar --no-recursion --uid 0 --gid 0 --uname root --gname root -cf - -T - |
                  gzip -n > "$archive")
              fi
              ;;
          esac
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          else
            (cd dist && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: encore-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error
