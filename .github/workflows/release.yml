name: Native Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version used inside archives
        required: true
        default: nightly

permissions:
  contents: write

jobs:
  bootstrap-ir:
    name: Generate bootstrap IR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify native stage0
        run: sha256sum --check bootstrap/encore-stage0-linux-x86_64.sha256
      - name: Generate target IR
        working-directory: index/encore
        run: |
          mkdir -p target
          gzip -dc ../../bootstrap/encore-stage0-linux-x86_64.gz > target/encore-stage0
          chmod +x target/encore-stage0
          for triple in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc \
            aarch64-pc-windows-msvc
          do
            ./target/encore-stage0 build --profile extreme --target "$triple" --emit llvm-ir
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-ir
          path: index/encore/target/*/extreme/encore.ll
          if-no-files-found: error
          retention-days: 1

  build:
    needs: bootstrap-ir
    env:
      ENCORE_CORE_DIR: ${{ github.workspace }}/core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            executable: encore
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            executable: encore
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            executable: encore
          - os: macos-15
            triple: aarch64-apple-darwin
            executable: encore
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            executable: encore.exe
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            executable: encore.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-ir
          path: index/encore/target
      - name: Assemble native seed
        shell: bash
        run: |
          mkdir -p index/encore/target/extreme
          set +e
          output=$(clang -O0 -w \
            index/encore/target/${{ matrix.triple }}/extreme/encore.ll \
            core/runtime.c index/ehir-llvm-backend/runtime.c index/rich/runtime.c \
            -o index/encore/target/extreme/${{ matrix.executable }} 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            message=${output//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            message=${message//$'\r'/'%0D'}
            echo "::error title=Native seed assembly failed::$message"
            exit "$code"
          fi
      - name: Native self-host and tests
        shell: bash
        working-directory: index/encore
        run: |
          ./target/extreme/${{ matrix.executable }} build --profile extreme --target ${{ matrix.triple }}
          cp target/${{ matrix.triple }}/extreme/${{ matrix.executable }} target/extreme/${{ matrix.executable }}
          ./target/extreme/${{ matrix.executable }} build --profile extreme
          ./target/extreme/${{ matrix.executable }} test --filter target_
      - name: Package
        id: package
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          mkdir -p dist
          scripts/package-release.sh index/encore/target/extreme/${{ matrix.executable }} ${{ matrix.triple }} "$RELEASE_VERSION" dist
          archive=$(find dist -maxdepth 1 -type f | head -n 1)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: encore-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'nightly') || contains(github.ref_name, 'unstable') }}
