name: Trusted Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ENCORE_INDEX_URL: https://raw.githubusercontent.com/encore-ecosystem/encore-index/a931b185d56bc9ae9515cfdabde721486a8c7b0c
  CORE_ARCHIVE: https://github.com/encore-ecosystem/encore-index/releases/download/packages-v0.1.4/core-0.0.0.tar.gz

jobs:
  bootstrap-ir:
    runs-on: ubuntu-latest
    env:
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Recover and verify historical stage0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/stage0 target/core
          git show origin/trunk:bootstrap/encore-stage0-linux-x86_64.gz > target/stage0/encore.gz
          expected=$(git show origin/trunk:bootstrap/encore-stage0-linux-x86_64.sha256 | awk 'NF {print $1; exit}')
          test "$(sha256sum target/stage0/encore.gz | awk '{print $1}')" = "$expected"
          gzip -dc target/stage0/encore.gz > target/stage0/encore
          chmod +x target/stage0/encore
          curl --fail --location --retry 5 "$CORE_ARCHIVE" -o target/core.tar.gz
          tar -xzf target/core.tar.gz -C target/core
          echo "ENCORE_CORE_DIR=$PWD/target/core" >> "$GITHUB_ENV"
      - name: Materialize path dependencies understood by historical stage0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/bootstrap-index
          for spec in \
            std:std-1.0.0 \
            rich:rich-1.0.0 \
            json:json-1.0.0 \
            ehirlib:ehirlib-0.0.0 \
            ehir_llvm_backend:ehir_llvm_backend-0.0.0 \
            toml:toml-1.0.0 \
            colorterm:colorterm-1.0.0 \
            log:log-1.0.0 \
            llvm:llvm-0.0.0
          do
            destination=${spec%%:*}
            archive=${spec#*:}
            mkdir -p "target/bootstrap-index/$destination"
            curl --fail --location --retry 5 \
              "https://github.com/encore-ecosystem/encore-index/releases/download/packages-v0.1.4/$archive.tar.gz" \
              -o "target/$archive.tar.gz"
            tar -xzf "target/$archive.tar.gz" -C "target/bootstrap-index/$destination"
          done
          sed -i \
            -e 's|index@std@1.0.0|path@target/bootstrap-index/std|g' \
            -e 's|index@rich@1.0.0|path@target/bootstrap-index/rich|g' \
            -e 's|index@json@1.0.0|path@target/bootstrap-index/json|g' \
            -e 's|index@ehirlib@0.0.0|path@target/bootstrap-index/ehirlib|g' \
            -e 's|index@ehir_llvm_backend@0.0.0|path@target/bootstrap-index/ehir_llvm_backend|g' \
            -e 's|index@toml@1.0.0|path@target/bootstrap-index/toml|g' \
            -e 's|index@colorterm@1.0.0|path@target/bootstrap-index/colorterm|g' \
            encore.toml
          for manifest in target/bootstrap-index/*/encore.toml; do
            sed -i \
              -e 's|index@std@1.0.0|path@../std|g' \
              -e 's|index@json@1.0.0|path@../json|g' \
              -e 's|index@ehirlib@0.0.0|path@../ehirlib|g' \
              -e 's|index@llvm@0.0.0|path@../llvm|g' \
              -e 's|index@colorterm@1.0.0|path@../colorterm|g' \
              -e 's|index@log@1.0.0|path@../log|g' \
              "$manifest"
          done
      - name: Generate current compiler IR for every trusted target
        shell: bash
        run: |
          set -euo pipefail
          for triple in \
            x86_64-pc-windows-msvc
          do
            target/stage0/encore build --profile extreme --target "$triple" --emit llvm-ir
          done
      - uses: actions/upload-artifact@v7
        with:
          name: trusted-bootstrap-ir
          path: target/*/extreme/encore.ll
          if-no-files-found: error

  build:
    needs: bootstrap-ir
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            executable: encore.exe
    runs-on: ${{ matrix.os }}
    env:
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: trusted-bootstrap-ir
          path: target
      - name: Fetch runtime sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/runtime/core target/runtime/backend target/runtime/rich
          curl --fail --location --retry 5 "$CORE_ARCHIVE" -o target/core.tar.gz
          curl --fail --location --retry 5 \
            https://github.com/encore-ecosystem/encore-index/releases/download/packages-v0.1.4/ehir_llvm_backend-0.0.0.tar.gz \
            -o target/backend.tar.gz
          curl --fail --location --retry 5 \
            https://github.com/encore-ecosystem/encore-index/releases/download/packages-v0.1.4/rich-1.0.0.tar.gz \
            -o target/rich.tar.gz
          tar -xzf target/core.tar.gz -C target/runtime/core
          tar -xzf target/backend.tar.gz -C target/runtime/backend
          tar -xzf target/rich.tar.gz -C target/runtime/rich
          echo "ENCORE_CORE_DIR=$PWD/target/runtime/core" >> "$GITHUB_ENV"
      - name: Assemble current native seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/seed
          platform_links=()
          case "${{ matrix.triple }}" in
            *-linux-*) platform_links=(-lssl -lcrypto) ;;
            *-apple-*) platform_links=(-framework Security -framework CoreFoundation) ;;
          esac
          clang -O0 -w \
            "target/${{ matrix.triple }}/extreme/encore.ll" \
            runtime.c \
            target/runtime/core/runtime.c \
            target/runtime/backend/runtime.c \
            target/runtime/rich/runtime.c \
            "${platform_links[@]}" \
            -o "target/seed/${{ matrix.executable }}"
          "target/seed/${{ matrix.executable }}" --version
      - name: Materialize registry cache on Windows
        shell: bash
        run: |
          set -euo pipefail
          awk '
            function emit() {
              if (name != "" && archive != "") print name "\t" version "\t" checksum "\t" archive
            }
            /^\[\[packages\]\]$/ { emit(); name=version=checksum=archive=""; next }
            /^name = / { name=$3; gsub(/"/, "", name) }
            /^version = / { version=$3; gsub(/"/, "", version) }
            /^checksum = / { checksum=$3; gsub(/"/, "", checksum) }
            /^archive = / { archive=$3; gsub(/"/, "", archive) }
            END { emit() }
          ' encore.lock |
          while IFS=$'\t' read -r name version checksum archive; do
            destination="$PWD/target/registry/packages/$name/$version-$checksum"
            mkdir -p "$destination"
            curl --fail --location --retry 5 "$archive" -o target/package.tar.gz
            tar -xzf target/package.tar.gz -C "$destination"
          done
      - name: Verify byte-identical self-host
        shell: bash
        run: |
          set -euo pipefail
          "target/seed/${{ matrix.executable }}" sync
          "target/seed/${{ matrix.executable }}" build --profile extreme --target "${{ matrix.triple }}"
          mkdir -p target/stage1
          cp "target/${{ matrix.triple }}/extreme/${{ matrix.executable }}" "target/stage1/${{ matrix.executable }}"
          "target/stage1/${{ matrix.executable }}" build --profile extreme --target "${{ matrix.triple }}"
          mkdir -p target/stage2
          cp "target/${{ matrix.triple }}/extreme/${{ matrix.executable }}" "target/stage2/${{ matrix.executable }}"
          cmp "target/stage1/${{ matrix.executable }}" "target/stage2/${{ matrix.executable }}"
          "target/stage2/${{ matrix.executable }}" test --filter target_
      - name: Package self-contained trusted toolchain
        shell: bash
        run: |
          set -euo pipefail
          package="encore-0.1.4-${{ matrix.triple }}"
          root="$PWD/target/package/$package"
          mkdir -p "$root/bin" "$root/lib/encore/index" "$root/share/doc/encore" dist
          cp "target/stage2/${{ matrix.executable }}" "$root/bin/${{ matrix.executable }}"
          chmod +x "$root/bin/${{ matrix.executable }}" 2>/dev/null || true
          for name in core std rich json ehirlib ehir_llvm_backend toml colorterm log llvm; do
            if test "$name" = core; then
              source="$ENCORE_CORE_DIR"
              destination=core
            else
              source=$(find "$PWD/target/registry/packages/$name" -mindepth 1 -maxdepth 1 -type d | head -n 1)
              destination=$name
              case "$name" in ehirlib) destination=ehir ;; ehir_llvm_backend) destination=ehir-llvm-backend ;; esac
            fi
            test -f "$source/encore.toml"
            cp -R "$source" "$root/lib/encore/index/$destination"
          done
          cp LICENSE README.md "$root/share/doc/encore/"
          printf '0.1.4\n' > "$root/VERSION"
          find "$root" -exec touch -t 200001010000.00 {} +
          case "${{ matrix.triple }}" in
            *-windows-*)
              archive="$PWD/dist/encore-${{ matrix.triple }}.zip"
              (cd target/package && COPYFILE_DISABLE=1 tar -a -cf "$archive" "$package")
              ;;
            *)
              archive="$PWD/dist/encore-${{ matrix.triple }}.tar.gz"
              if tar --version 2>/dev/null | grep -q GNU; then
                tar -C target/package --sort=name --owner=0 --group=0 --numeric-owner -czf "$archive" "$package"
              else
                (cd target/package && find "$package" -print | LC_ALL=C sort |
                  COPYFILE_DISABLE=1 tar --no-recursion --uid 0 --gid 0 --uname root --gname root -cf - -T - |
                  gzip -n > "$archive")
              fi
              ;;
          esac
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          else
            (cd dist && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: encore-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error
